<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title desc">
  <title id="title">TCS logo</title>
  <desc id="desc">Logo treatment for Tata Consultancy Services</desc>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f36" />
      <stop offset="40%" stop-color="#ff7f2a" />
      <stop offset="70%" stop-color="#f92d7a" />
      <stop offset="100%" stop-color="#8c2c8c" />
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="white" />
  <g transform="translate(60,120)">
    <text x="0" y="140" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="200" fill="url(#grad)">tcs</text>
    <text x="340" y="70" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="62" fill="#0066b3">TATA</text>
    <text x="340" y="135" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="58" fill="#0b72c6">CONSULTANCY</text>
    <text x="340" y="200" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="58" fill="#0b72c6">SERVICES</text>
  </g>
</svg>
